[book]
authors = ["Benjamin Schuster-Boeckler","Pascal Hertleif"]
language = "en"
src = "src"
title = "Rastair"
description = "Rastair is a command-line tool to process epigentic sequencing data. It can call genetic variants and DNA methylation simultaneously from Illumina™ 5base and TAPS+."

[preprocessor.glossary]
command = "cargo run -p mdbook-glossary"
glossary = "src/glossary.yaml"

[preprocessor.katex]
after = ["links"]

[output.html]
additional-js = ["theme/silktide-consent-manager.js", "theme/consent-banner.js"]
git-repository-url = "https://github.com/bsbludwig/rastair"
additional-css = ["theme/custom.css", "theme/silktide-consent-manager.css"]
theme = "theme"

[output.html.search]
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 2
