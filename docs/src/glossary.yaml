- key: TAPS
  long: "TET-Assisted Pyridine-Borane Sequencing"
  group: "Genetics"
  description: |
    A method for detecting DNA modifications, such as @methylation, at single-base resolution. TAPS uses a chemical reaction to convert 5-methylcytosine (5mC) to thymine (T) while leaving unmodified cytosines unchanged. Allows the detection of 5mC sites using standard sequencing technologies. Alternative to @bisulfite sequencing, which can introduce biases and artifacts during the conversion process. You can read more about it [here](https://en.wikipedia.org/wiki/TET-assisted_pyridine_borane_sequencing).

- key: 5Base
  long: "Illumina 5-Base sequencing"
  group: "Genetics"
  description: |
    Illumina launched a chemistry that uses a custom enzyme to convert methylated (and hydroxymethylated) cytosine to thymine. The resulting data look very similar to TAPS data. Read more [here](https://www.illumina.com/science/genomics-research/articles/5-base-solution.html).

- key: bisulfite
  group: "Genetics"
  description: |
    A chemical treatment that converts only _unmethylated_ cytosines to uracil in DNA. Used in bisulfite sequencing to detect DNA @methylation patterns.

- key: variant
  group: "Genetics"
  description: |
    A genomic locus that differs from the given @referenceGenome. Variants can be @SNV:pl, insertions, deletions, or structural changes.

- key: allele
  group: "Genetics"
  description: |
    In cells with more than one homologous chromosomes, an allele refers to each of the observed sequences. In particular, a diploid genome will have two alleles per autosomal position.

- key: refAllele
  short: "reference allele"
  group: "Genetics"
  description: |
    @allele that matches the @referenceGenome at a specific @locus. Opposite to @altAllele.

- key: altAllele
  short: "alternative allele"
  group: "Genetics"
  description: |
    @allele that is different from the @refAllele at a specific @locus. Opposite to @refAllele.

- key: referenceGenome
  short: "reference genome"
  group: "Genetics"
  description: |
    Sequence of the species' genome that is used as a reference for comparing and analyzing genetic data. In particular, most alignment algorithms will use a reference genome to map reads to.

- key: haplotype
  group: "Genetics"
  description: |
    A haplotype is a set of @variant:pl that co-occur on the same chromosome sequence, and are therefore linked.

- key: methylation
  group: "Genetics"
  description: |
    Cytosine methylation is the enzymatic addition of a methyl group to cytosine by DNA methyltransferases. In animals, DNA methylation occurs at @CpG dinucleotides.

- key: methylated
  group: "Genetics"
  description: |
    Refers to a base that has undergone @methylation.

- key: SNV
  long: "Single Nucleotide Variant"
  group: "Genetics"
  description: |
    A variation in a single nucleotide that occurs at a specific position in the genome. SNV is commonly used to refer to somatic variation, _ie._ a difference between _eg._ a cancer and its host.

- key: SNP
  long: "Single Nucleotide Polymorphism"
  group: "Genetics"
  description: |
    Formally, a SNP is a @variant that occurs at a given minimum frequency in the population. However, it is nowadays often used to refer to any inherited @variant in an individual.

- key: SAM
  long: "Sequence Alignment Map"
  group: "File Formats"
  description: |
    A text-based file format that stores sequence data in a tab-delimited format. [Format Specification for version 1.0](https://samtools.github.io/hts-specs/SAMv1.pdf). It is used to store the alignment of sequence reads to a @referenceGenome. SAM files are used to visualize and analyze sequence data in genome browsers like @IGV.

    Additional keys are defined in the [Optional Fields Specification](https://samtools.github.io/hts-specs/SAMtags.pdf).

- key: BAM
  long: "Binary Alignment Map"
  group: "File Formats"
  description: |
    A binary version of the @SAM file format. It is a compressed, indexed, and binary representation of the sequence alignment data. BAM files are used to store sequence data efficiently. They can be visualized and analyzed in genome browsers like @IGV.

- key: BED
  long: "Browser Extensible Data"
  group: "File Formats"
  description: |
    A tab-separated-file format that stores genomic regions as a list of intervals.

    It looks like this:
    ```
    chr1	11873	12227	ENSG00000223972.5	0	+
    chr1	12612	12721	ENSG00000227232.5	0	-
    chr1	13220	14409	ENSG00000278267.1	0	+
    ```

    The first three columns represent the chromosome, start position, and end position of the interval. The other columns contain additional information about the interval. Importantly, the start position in a bed file is 0-based, and the end position refers to the first base that is outside the interval. So, to refer to the first base of chromosome 1, one would write

    ```
    chr1 0 1 Interval_of_length_1
    ```

- key: VCF
  long: "Variant Call Format"
  group: "File Formats"
  description: |
    Tab-separated-file format that stores information about genetic variants. [Format Specification for VCFv4.5](https://samtools.github.io/hts-specs/VCFv4.5.pdf). It is used to represent SNPs, insertions, deletions, and other types of genetic variations. VCF files contain information about the variant's position, @refAllele, @altAllele, quality score, and other annotations.

    It looks like this:

    ```
    #CHROM	POS	ID	REF	ALT	QUAL	FILTER	INFO	FORMAT	sample1	sample2
    chr1	10001	.	A	C	30	PASS	.	GT:DP	0/1:10	1/1:20
    chr1	10002	.	T	G	20	PASS	.	GT:DP	0/1:15	1/1:25
    ```

    The first row contains the column headers. The first eight columns are mandatory fields that describe the variant. The remaining columns contain information about the samples and their genotypes. Importantly, unlike in @BED, the position column in VCF files is 1-based.

- key: FASTA
  group: "File Formats"
  description: |
    A text-based file format for storing nucleotide or protein sequences. Each record consists of a header line starting with `>`, followed by one or more lines of sequence. Rastair uses FASTA files to store the @referenceGenome sequence, indexed with `samtools faidx` for efficient random access.

- key: FASTQ
  group: "File Formats"
  description: |
    A text-based file format that stores DNA or RNA sequences, optionally with corresponding quality scores such as produced by most sequencing machines. It is used to store raw sequencing data from high-throughput sequencing experiments. FASTQ files contain the sequence data in the form of nucleotide bases (A, T, C, G) and @Phred-scaled quality scores that represent the confidence in each base call.

- key: samtools
  short: SAMtools
  group: "Tools"
  description: |
    A [suite of utilities](https://www.htslib.org/doc/samtools.html) for manipulating @SAM and @BAM. It can manipulate @SAM and @BAM files.

- key: bcftools
  short: BCFtools
  group: "Tools"
  description: |
    A [set of utilities](https://samtools.github.io/bcftools/bcftools.html) for manipulating variant calls in the @VCF and BCF file formats.

- key: bedtools
  short: BEDtools
  group: "Tools"
  description: |
    A popular [suite of utilities](https://bedtools.readthedocs.io/en/latest/) for manipulating genomic intervals stored in @BED files.

- key: GATK
  short: GATK
  long: "Genome Analysis Toolkit"
  group: "Tools"
  description: |
    A [software package](https://gatk.broadinstitute.org) for analyzing sequencing data with tools for variant discovery, genotyping, and other analyses.

- key: BCF
  long: "Binary Call Format"
  group: "File Formats"
  description: |
    A binary version of the @VCF file format. It stores variant calls in a compressed and indexed binary format. BCF files are more efficient for storing large variant datasets and can be used with tools like @bcftools.

- key: IGV
  long: "Integrative Genomics Viewer"
  group: "Tools"
  description: |
    A [tool for interactive exploration](https://igv.org/) of @SAM and @BAM files.
    Also see  @screenshot-igv.

- key: locus
  group: "Genetics"
  description: |
    A specific position on a chromosome, for example the position of a @variant in the genome.

- key: assay
  group: "Genetics"
  description: |
    A test or procedure used to measure a specific property or characteristic of a sample. In genetics, assays are used to detect and measure genetic variations, gene expression levels, protein interactions, and other biological processes.

- key: CIGAR
  long: "Compact Idiosyncratic Gapped Alignment Report"
  group: "Sequence Analysis"
  description: |
    A string that represents the alignment of a sequence read to a @referenceGenome. It encodes information about the alignment, including matches, mismatches, insertions, deletions, and skips. It is used in the @SAM and @BAM file formats.

- key: bwa2-aligner
  short: "BWA"
  long: "Burrows-Wheeler Aligner"
  group: "Tools"
  description: |
    A [sequence alignment program](https://github.com/bwa-mem2/bwa-mem2) for mapping low-divergent sequences against a large @referenceGenome.

- key: Minimap2
  short: "Minimap2"
  group: "Tools"
  # link: https://github.com/lh3/minimap2
  description: |
    A [sequence alignment program](https://github.com/lh3/minimap2) that aligns DNA or mRNA sequences against a reference database. Often used for long-read data.

- key: RMS
  long: "Root Mean Square"
  group: "Statistics"
  description: |
    Statistical measure of the average deviation of a set of values from their mean.

- key: ChiSquare
  short: "Chi-square test"
  group: "Statistics"
  description: |
    Determine whether there is a significant association between the observed frequencies of the variables with the expected frequencies to assess the independence of the variables.

    The test statistic is calculated as the sum of the squared differences between the observed and expected frequencies, divided by the expected frequencies. The resulting value is compared to a critical value from the Chi-square distribution to determine statistical significance:
      $$ \chi^2 = \sum_i \frac{(O_i - E_i)^2}{E_i} $$
    where $O_i$ is the observed frequency, $E_i$ is the expected frequency, and the sum is taken over all categories.

    The Chi-square test is commonly used in genetics to assess the association between genetic variants and phenotypes, as well as in population genetics to test for deviations from Hardy-Weinberg equilibrium, which describes the expected frequencies of genotypes in a population under certain assumptions.

- key: RandomForest
  short: RF
  long: "Random Forest"
  group: "Statistics"
  description: |
    Supervised learning algorithm, used for classification and regression.

- key: GIAB
  short: GIAB
  long: Genome In a Bottle
  group: "Genetics"
  # link: https://www.nist.gov/programs-projects/genome-bottle
  description: |
    "A public-private-academic consortium hosted by NIST to develop the technical infrastructure (reference standards, reference methods, and reference data) to enable translation of whole human genome sequencing to clinical practice and innovations in technologies." -- [nist.gov](https://www.nist.gov/programs-projects/genome-bottle)

- key: DiploidGenome
  short: diploid genome
  group: "Genetics"
  description: |
    Genome that contains two sets of chromosome:pl, one set inherited from each parent.

- key: ML
  long: "Machine Learning"
  group: "Statistics"
  description: |
    Algorithms that can receive input data and use statistical analysis to predict an output value within an acceptable range.

- key: indel
  long: "insertion/deletion"
  group: "Genetics"
  description: |
    Variation in the genome where a small number of nucleotides are inserted or deleted.

- key: CpG
  short: CpG
  long: "Cytosine-phosphate-Guanine"
  group: "Genetics"
  description: |
    A site in the DNA sequence where a cytosine nucleotide is followed by a guanine nucleotide in the linear sequence of bases along its 5' → 3' direction. CpG sites are often associated with gene regulation through DNA @methylation.

- key: Rust
  group: "Programming"
  description: |
    A systems programming language, known for its safety, speed, and concurrency.

- key: htslib
  group: "Tools"
  description: |
    A C library for reading/writing sequencing data, used by tools like @samtools and @bcftools to manipulate @SAM, @BAM, and @VCF files. Rastair uses the @Rust bindings provided by the `rust-htslib` crate.

- key: mapQ
  long: "mapping quality"
  group: "Sequence Analysis"
  description: |
    A @Phred-scaled probability that the mapping position of a read is incorrect. A higher mapping quality indicates a more reliable alignment. Numbers are typically between 0 and 60.

- key: baseQ
  long: "base quality"
  group: "Sequence Analysis"
  description: |
    A @Phred-scaled probability that the base call is incorrect. A higher base quality indicates a more reliable base call. Numbers are typically between 0 and 40.

- key: Phred-scaled
  group: "Statistics"
  description: |
    A Phred-scaled quality score is a logarithmic measure of the probability that a base call is incorrect. The formula is $ Q = -10 \cdot \log P $ where $P$  is the probability of an incorrect base call. A higher Phred score indicates a more reliable base call. The name "Phred" comes from the base calling software of the same name.

- key: OT
  long: Original Top
  group: "Sequence Analysis"
  description: |
    The "original top" of the DNA fragment that was sequenced. The "top" by definition is the sequence that matches the reference sequence.

- key: OB
  long: Original Bottom
  group: "Sequence Analysis"
  description: |
    The "original bottom" of the DNA fragment that was sequenced.

- key: maximumLikelihood
  short: maximum likelihood
  group: "Statistics"
  description: |
    A method used to estimate the parameters of a statistical model. It finds the parameter values that maximize the likelihood of the observed data. The maximum likelihood estimate is the set of parameter values that make the observed data most probable. It is a common method for fitting models to data in statistics and machine learning.

- key: CLI
  long: "Command Line Interface"
  group: "Programming"
  description: |
    Terminal-based interface for interacting with software using text commands.

- key: bgzip
  group: "Tools"
  description: |
    Compression tool that produces @BGZF files, commonly used to compress @VCF and @BAM files. Part of @samtools. [Homepage](https://www.htslib.org/doc/bgzip.html).

- key: BGZF
  long: "Blocked GNU Zip Format"
  group: "File Formats"
  description: |
    A block compression format in which the input file is compressed as a series of GZIP-compressed blocks that can be indexed for efficient random access.

- key: LLVM
  group: "Programming"
  description: |
    Compiler infrastructure project, used as backend for various programming languages including the official @Rust compiler.

- key: closure
  group: "Programming"
  description: |
    A function that "closes over" bindings in the surrounding scope, i.e., variables from around its definition location are accessible inside of it.

- key: record
  group: "Sequence Analysis"
  description: |
    Alternative term for @read.

- key: read
  long: sequence read
  group: "Sequence Analysis"
  description: |
    A sequence of DNA or RNA that is generated by a high-throughput sequencing technology. In "short-read sequencing", they are typically between a few dozen and a few hundred base pairs long.

- key: alignment
  group: "Sequence Analysis"
  description: |
    Represents the position and base-to-base mapping of a sequence @read to a @referenceGenome.

- key: pileup
  group: "Sequence Analysis"
  description: |
    A summary of the read alignments at a specific position in the @referenceGenome in @BAM and @SAM files. As a data structure, a pileup is a matrix where each row represents a @read and each column represents a position in the @referenceGenome. From this, the most likely base at that position can be inferred and used to call variants.

- key: qname
  long: "query template name"
  group: "File Formats"
  description: |
    A unique identifier for a sequence @read in a @SAM or @BAM file. It is used to track the origin of the read and link it to other information in the file. Example: `NB502094:69:HN2H2BGX5:2:21111:24699:8526`

- key: flamegraph
  group: "Programming"
  description: |
    A visualization of profiled software, allowing the user to see which functions are consuming the most time. The x-axis represents the stack depth, and the y-axis represents the function name. The width of each box represents the amount of time spent in that function. @gregg2016flame

- key: LTO
  long: "Link Time Optimization"
  group: "Programming"
  description: |
    A compiler optimization technique that performs optimizations across the entire program at link time, rather than at compile time. This can lead to improved performance and reduced code size.

- key: CI
  long: "Continuous Integration"
  group: "Programming"
  description: |
    A software development practice where automated tests and builds are run on a regular basis (e.g. on every push to the repository) to ensure that code changes do not introduce new bugs or issues.

- key: VAF
  long: "Variant Allele Frequency"
  group: "Genetics"
  description: |
    The proportion of observations of a specific @altAllele in a sample, compared to the total number of observations @locus:

    $ \text{VAF} = \frac{\text{Reads supporting the variant allele}}{\text{Total reads covering the site}} $

- key: PGO
  long: "Profile-Guided Optimization"
  group: "Programming"
  description: |
    A compiler optimization technique that uses profiling information from previous runs of the program to optimize the code for better performance. This can lead to improved runtime performance and reduced code size.

- key: denovo
  short: de-novo CpG
  group: "Genetics"
  description: |
    A @CpG site that is not present in the @referenceGenome but seems to occur in the sample when there is a variant that turns a `NG` (or a `CN`) into a `CG`.

- key: tabix
  group: "Tools"
  description: |
    An indexing tool for tab-delimited files, such as @VCF and @BED files. It creates an index file that allows for efficient random access to specific regions of the file. Part of @samtools. [Homepage](https://www.htslib.org/doc/tabix.html)

- key: STDOUT
  short: "`stdout`"
  long: "standard output"
  group: "Programming"
  description: |
    The default program output for terminal applications, which streams it either to the terminal or the next program in a pipeline.

    For example, when running `ls -l | grep "myfile"`, `ls -l` sends its output to the standard output, which is then piped to `grep` to filter for lines containing "myfile".

- key: dragen
  short: DRAGEN
  group: "Tools"
  description: |
    Illumina DRAGEN (Dynamic Read Analysis for GENomics) is a platform for genomic data analysis, providing alignment, variant calling, and other bioinformatics tasks. [Homepage](https://www.illumina.com/products/by-type/informatics-products/dragen-secondary-analysis.html)

- key: bismark
  short: Bismark
  group: "Tools"
  description: |
    A tool to map bisulfite converted sequence reads and determine cytosine methylation states. [Homepage](https://felixkrueger.github.io/Bismark/)

- key: GPU
  long: "Graphics Processing Unit"
  group: "Programming"
  description: |
    Graphics processor, originally designed for rendering graphics, but increasingly used for general-purpose computing due to its ability to perform parallel computations efficiently. GPUs are commonly used in machine learning, scientific simulations, and other computationally intensive tasks.

- key: Vulkan
  group: "Programming"
  description: |
    A graphics and compute API that provides high-performance access to modern GPUs. It is designed to be cross-platform and is used for developing applications that require high-performance graphics and compute capabilities, such as video games, scientific simulations, and machine learning.

- key: SLURM
  short: SLURM
  long: "Simple Linux Utility for Resource Management"
  group: "Tools"
  description: |
    An open-source job scheduler used in high-performance computing environments to manage and allocate resources for computational tasks. It allows users to submit, monitor, and control jobs on a cluster of computers. [Homepage](https://slurm.schedmd.com/)
