[package]
name = "rastair2-vcf"
version = "0.1.0"
description = "A VCF writer for Rastair2."
authors = ["Pascal Hertleif <pascal@softleif.se>"]
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
rust-htslib = { version = "0.49.0", default-features = false, features = [
    "bzip2",
    "lzma",
] }
color-eyre = "0.6.3"
smallvec = { version = "2.0.0-alpha.11", features = ["std"] }
smol_str = "0.3.2"

[dev-dependencies]
insta = { version = "1.42.2", features = ["filters"] }
insta-cmd = "0.6.0"
pastey = "0.1.0"
proptest = "1.6.0"
tempfile = "3.19.1"
