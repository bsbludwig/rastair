version: 2.1

executors:
  rust-linux:
    docker:
      - image: ubuntu:20.04
    working_directory: ~/project

  macos-vm:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
    working_directory: ~/project

  aws-uploader:
    docker:
      - image: cimg/aws:2025.01
    working_directory: ~/project

commands:
  restore_rust_cache:
    steps:
      - restore_cache:
          keys:
            - v1-cargo-{{ arch }}-{{ checksum "Cargo.lock" }}
            - v1-cargo-{{ arch }}-

  save_rust_cache:
    steps:
      - save_cache:
          key: v1-cargo-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ~/project/target

jobs:
  build_linux:
    executor: rust-linux
    steps:
      - checkout
      - restore_rust_cache
      - run:
          name: Install system deps + Rust toolchain
          command: |
            set -euo pipefail
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates git curl unzip libclang-dev cmake samtools tabix build-essential

            curl https://sh.rustup.rs -sSf | sh -s -- -y
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
      - run:
          name: Build + package (Linux)
          command: |
            set -euo pipefail
            source "$BASH_ENV"

            BIN_NAME="rastair"
            TARGET="x86_64-unknown-linux-gnu"
            VERSION="${CIRCLE_TAG:?This workflow should run on tags only}"
            OUTDIR="dist/${BIN_NAME}-${VERSION}-${TARGET}"
            TARBALL="${BIN_NAME}-${VERSION}-${TARGET}.tar.gz"

            cargo build --release --locked --target "${TARGET}"

            mkdir -p "${OUTDIR}"
            cp "target/${TARGET}/release/${BIN_NAME}" "${OUTDIR}/"
            cp -R scripts/* "${OUTDIR}/"

            (cd dist && tar -czf "${TARBALL}" "$(basename "${OUTDIR}")")
            (cd dist && sha256sum "${TARBALL}" > "${TARBALL}.sha256")
      - save_rust_cache
      - persist_to_workspace:
          root: ~/project
          paths:
            - dist/*.tar.gz
            - dist/*.sha256

  build_macos:
    executor: macos-vm
    steps:
      - checkout
      - restore_rust_cache
      - run:
          name: Install build deps (macOS)
          command: |
            set -euo pipefail

            # Install Rust toolchain
            curl https://sh.rustup.rs -sSf | sh -s -- -y
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"

            brew update
            brew install cmake samtools htslib
      - run:
          name: Build + package (macOS)
          command: |
            set -euo pipefail
            source "$BASH_ENV"

            : "${MACOS_CERT_B64:?Set MACOS_CERT_B64 in CircleCI env/context}"
            : "${APPLE_ID:?Set APPLE_ID in CircleCI env/context}"
            : "${APPLE_TEAM_ID:?Set APPLE_TEAM_ID in CircleCI env/context}"
            : "${APPLE_NOTARIZATION_PASSWORD:?Set APPLE_NOTARIZATION_PASSWORD in CircleCI env/context}"
            : "${MACOS_SIGN_IDENTITY:?Set MACOS_SIGN_IDENTITY in CircleCI env/context}"

            KEYCHAIN_PASSWORD="${CERT_PASSWORD}"
            security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security set-keychain-settings -t 3600 -u build.keychain

            # Download and install the necessary intermediate certificates
            curl -O https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            security import DeveloperIDG2CA.cer \
              -k build.keychain

            # Import Developer ID Application cert (.p12)
            echo "${MACOS_CERT_B64}" | base64 --decode > macos_signing.p12
            security import macos_signing.p12 \
              -k build.keychain \
              -T /usr/bin/codesign \
              -T /usr/bin/security \
              -P ${KEYCHAIN_PASSWORD}

            # Allow codesign to access the key without prompts
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ${KEYCHAIN_PASSWORD} build.keychain

            # Store notary credentials in keychain (once per job run)
            xcrun notarytool store-credentials "notary-profile" \
              --apple-id "${APPLE_ID}" \
              --team-id "${APPLE_TEAM_ID}" \
              --password "${APPLE_NOTARIZATION_PASSWORD}"

            BIN_NAME="rastair"
            VERSION="${CIRCLE_TAG:?This workflow should run on tags only}"

            for TARGET in aarch64-apple-darwin x86_64-apple-darwin; do
              rustup target add "${TARGET}"
              cargo build --release --locked --target "${TARGET}"

              OUTDIR="dist/${BIN_NAME}-${VERSION}-${TARGET}"

              mkdir -p "${OUTDIR}"
              cp "target/${TARGET}/release/${BIN_NAME}" "${OUTDIR}/"
              cp -R scripts/* "${OUTDIR}/"

              # Sign each built binary (per target)
              codesign --force --options runtime --timestamp \
                --sign "${MACOS_SIGN_IDENTITY}" \
                "target/${TARGET}/release/${BIN_NAME}"

              codesign --verify --verbose=2 "target/${TARGET}/release/${BIN_NAME}"

              # Create a zip for notarization submission (not the tar.gz)
              NOTARY_ZIP="dist/${BIN_NAME}-${VERSION}-${TARGET}.zip"
              ditto -c -k --sequesterRsrc --keepParent "${OUTDIR}" "${NOTARY_ZIP}"

              # Submit and wait for result
              xcrun notarytool submit "${NOTARY_ZIP}" --keychain-profile "notary-profile" --wait
              xcrun stapler staple "${NOTARY_ZIP}"

              shasum -a 256 "${NOTARY_ZIP}" > "${NOTARY_ZIP}.sha256"
            done
      - save_rust_cache
      - persist_to_workspace:
          root: ~/project
          paths:
            - dist/*.zip
            - dist/*.sha256

  upload_release_to_s3:
    executor: aws-uploader
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Upload release artifacts to S3 (static AWS keys)
          command: |
            set -euo pipefail

            VERSION="${CIRCLE_TAG:?This workflow should run on tags only}"
            : "${S3_BUCKET:?Set S3_BUCKET in CircleCI env/context}"
            : "${AWS_REGION:?Set AWS_REGION in CircleCI env/context}"
            : "${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in CircleCI env/context}"
            : "${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in CircleCI env/context}"

            export AWS_DEFAULT_REGION="${AWS_REGION}"
            export AWS_REGION="${AWS_REGION}"

            cd dist
            cat *.sha256 | sort -k2 > SHA256SUMS

            aws s3 cp . "s3://${S3_BUCKET}/build/release-${VERSION}/" \
              --recursive \
              --exclude "*" \
              --include "*.tar.gz" \
              --include "*.zip" \
              --include "SHA256SUMS"

workflows:
  version: 2
  release:
    jobs:
      - build_linux:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - build_macos:
          context: rastair2_deploy
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - upload_release_to_s3:
          # optionally keep using a context for secrets:
          context: rastair2_deploy
          requires:
            - build_linux
            - build_macos
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
