[package]
name = "rastair2"
description = "Fast and flexible extraction of methylation information from BAM files"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Benjamin Schuster-Boeckler", "Pascal Hertleif <pascal@softleif.se>"]
readme = "README.md"

[dependencies]
anyhow = "1.0.97"
bgzip = "0.3.1"
bio = "2.2.0"
bitflags = "2.8.0"
clap = { version = "4.5.35", features = ["derive", "env"] }
clio = { version = "0.3.5", features = ["clap", "clap-parse", "pipe"] }
color-eyre = "0.6.3"
rust-htslib = "0.49.0"
smallvec = { version = "2.0.0-alpha.11", features = ["std"] }
smol_str = "0.3.2"
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = "0.3.19"

[dev-dependencies]
proptest = "1.6.0"
