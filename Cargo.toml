[package]
name = "rastair"
description = "Fast and flexible extraction of methylation information from bam files"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
bio = "1.3.1"
clap = {version = "4.3.21", features = ["derive"]}
hashers = "1.0.1"
libc = "0.2.147"
log = "0.4.20"
memchr = "2.6.4"
r2d2 = "0.8.10"
rust-htslib = "0.44.1"
stderrlog = "0.5.4"
thiserror = "1.0.49"

[profile.profiling]
inherits = "release"
debug = true
