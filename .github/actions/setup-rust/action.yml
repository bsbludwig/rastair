name: Setup Rust
description: >-
  Install rustup (if the runner image does not already ship it) and the exact
  toolchain pinned in rust-toolchain.toml, plus any extra targets.

inputs:
  targets:
    description: Space-separated list of additional rustup targets to install.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install rustup and pinned toolchain
      shell: bash
      env:
        EXTRA_TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail

        if ! command -v rustup >/dev/null 2>&1; then
          echo "::group::Installing rustup"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- --default-toolchain none --profile minimal --no-modify-path -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "::endgroup::"
        fi

        # Single source of truth for the toolchain version. `rustup` would pick
        # this up implicitly, but installing it explicitly keeps the version
        # visible in the log and works the same in bare containers.
        channel="$(grep -m1 -E '^[[:space:]]*channel[[:space:]]*=' rust-toolchain.toml \
          | sed -E 's/.*"([^"]+)".*/\1/')"
        if [ -z "$channel" ]; then
          echo "Could not read [toolchain].channel from rust-toolchain.toml" >&2
          exit 1
        fi
        echo "Pinned toolchain: $channel"

        rustup toolchain install "$channel" --profile default --no-self-update
        rustup default "$channel"

        for target in $EXTRA_TARGETS; do
          rustup target add --toolchain "$channel" "$target"
        done

        rustc --version
        cargo --version
