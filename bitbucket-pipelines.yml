image: rust:1.89 # keep in sync with `rust-toolchain.yml`

options:
  max-time: 30

definitions:
  caches:
    cargo-registry: /usr/local/cargo/registry/
    cargo-git: /usr/local/cargo/git/
    cargo-target: target/debug//

pipelines:
  default:
    - parallel:
        steps:
          - step:
              name: Formatting
              fail-fast: false
              script:
                - rustup component add rustfmt
                - cargo fmt -- --check
          - step:
              name: Test
              caches:
                - cargo-registry
                - cargo-git
                - cargo-target
              script:
                - apt-get update && apt-get install -y --no-install-recommends curl unzip libclang-dev cmake samtools tabix
                - cargo xtask test

  tags:
    "*":
      - step:
          name: Release Build
          caches:
            - cargo-registry
            - cargo-git
          script:
            - apt-get update && apt-get install -y --no-install-recommends libclang-dev
            - cargo xtask release
          artifacts:
            - target/release/rastair
