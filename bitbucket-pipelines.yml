image: rust:1.86 # keep in sync with `rust-toolchain.yml`

options:
  max-time: 30

definitions:
  caches:
    # Cache Cargo registry and index for faster dependency downloads
    cargo-registry: /usr/local/cargo/registry/
    cargo-git: /usr/local/cargo/git/
    # Cache only dependency compilation artifacts, not our own code
    cargo-target-deps: target/debug/deps/
    cargo-target-build: target/debug/build/
    # Cache Deno modules for scripts
    deno-modules: ~/.cache/deno/

pipelines:
  default:
    - parallel:
        steps:
          - step:
              name: Formatting
              fail-fast: false
              script:
                - rustup component add rustfmt
                # Ensure code style
                - cargo fmt -- --check
          - step:
              name: Lint
              caches:
                - cargo-registry
                - cargo-git
                - cargo-target-deps
                - cargo-target-build
                - deno-modules
              script:
                # Dependencies
                - rustup component add clippy
                - apt-get update && apt-get install -y --no-install-recommends curl unzip libclang-dev
                # Install Deno for scripts
                - curl -fsSL https://deno.land/x/install/install.sh | sh
                - export DENO_INSTALL="/root/.deno"
                - export PATH="$DENO_INSTALL/bin:$PATH"
                # Run checks and generate reports
                - deno run --allow-all ci/clippy_report.ts
          - step:
              name: Test
              caches:
                - cargo-registry
                - cargo-git
                - cargo-target-deps
                - cargo-target-build
              script:
                # Dependencies
                - apt-get update && apt-get install -y --no-install-recommends curl unzip libclang-dev
                - curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
                # Run checks and generate reports
                - cargo nextest run --profile ci --workspace
                - mkdir -pv test-results; mv target/nextest/ci/junit.xml test-results/junit.xml

  tags:
    "*":
      - step:
          name: Release Build
          caches:
            - cargo-registry
            - cargo-git
            - cargo-target-deps
            - cargo-target-build
          script:
            # Dependencies
            - rustup component add clippy rustfmt
            - apt-get update && apt-get install -y --no-install-recommends libclang-dev
            # Build artifacts
            - cargo build --release
          artifacts:
            - target/release/rastair2
