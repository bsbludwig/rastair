image: rust:1.92 # keep in sync with `rust-toolchain.yml`

options:
  max-time: 30

definitions:
  caches:
    cargo-index: /usr/local/cargo/registry/index
    cargo-cache: /usr/local/cargo/registry/cache
    cargo-git: /usr/local/cargo/git/
    cargo-local-bin: .bin/

pipelines:
  default:
    - parallel:
        steps:
          - step:
              name: Formatting
              fail-fast: false
              script:
                - rustup component add rustfmt
                - cargo fmt -- --check
          - step:
              name: Test
              caches:
                - cargo-index
                - cargo-cache
                - cargo-git
                - cargo-local-bin
              script:
                - apt-get update && apt-get install -y --no-install-recommends curl unzip libclang-dev cmake samtools tabix
                - cargo xtask test

  tags:
    "*":
      - step:
          name: Release Build
          caches:
            - cargo-index
            - cargo-cache
            - cargo-git
            - cargo-local-bin
          script:
            - apt-get update && apt-get install -y --no-install-recommends libclang-dev
            - cargo xtask release
          artifacts:
            - target/release/rastair
