image: rust:1.86 # keep in sync with `rust-toolchain.yml`

definitions:
  caches:
    # Cache Cargo registry and index for faster dependency downloads
    cargo-registry: ~/.cargo/registry/
    cargo-git: ~/.cargo/git/
    # Cache only dependency compilation artifacts, not our own code
    cargo-target-deps: target/release/deps/
    cargo-target-build: target/release/build/
    # Cache Deno modules for scripts
    deno-modules: ~/.cache/deno/

pipelines:
  default:
    - step:
        name: Formatting
        fail-fast: false
        script:
          - rustup component add rustfmt
          # Ensure code style
          - cargo fmt -- --check
    - step:
        name: Build and Test
        caches:
          - cargo-registry
          - cargo-git
          - cargo-target-deps
          - cargo-target-build
          - deno-modules
        script:
          # Dependencies
          - rustup component add clippy
          - apt-get update && apt-get install -y --no-install-recommends curl unzip libclang-dev
          # Install Deno for scripts
          - curl -fsSL https://deno.land/x/install/install.sh | sh
          - export DENO_INSTALL="/root/.deno"
          - export PATH="$DENO_INSTALL/bin:$PATH"
          # Run checks and generate reports
          - deno run --allow-all ci/clippy_report.ts
          - deno run --allow-all ci/test_report.ts

  tags:
    "*":
      - step:
          name: Release Build
          caches:
            - cargo-registry
            - cargo-git
            - cargo-target-deps
            - cargo-target-build
          script:
            # Dependencies
            - rustup component add clippy rustfmt
            - apt-get update && apt-get install -y --no-install-recommends libclang-dev
            # Build artifacts
            - cargo build --release
          artifacts:
            - target/release/rastair2

options:
  max-time: 30
